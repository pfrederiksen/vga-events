name: Dependency Update

on:
  schedule:
    # Run weekly on Sundays at 9 AM UTC
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-dependencies:
    name: Update Go Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check for updates
        id: check
        run: |
          CURRENT_GO=$(grep "^go " go.mod | awk '{print $2}')
          echo "Checking for patch-level dependency updates compatible with Go $CURRENT_GO..."

          # Only attempt patch updates so automation stays within the current
          # supported Go line instead of proposing upgrades that require a newer toolchain.
          go get -u=patch ./...
          go mod tidy

          if git diff --quiet -- go.mod go.sum; then
            echo "updates=0" >> $GITHUB_OUTPUT
            echo "No compatible patch updates found"
          else
            echo "updates=1" >> $GITHUB_OUTPUT
            echo "Compatible patch updates found"
            echo "## Dependency Update Summary" > update-summary.md
            echo "" >> update-summary.md
            echo "Go version: $CURRENT_GO" >> update-summary.md
            echo "" >> update-summary.md
            echo '```diff' >> update-summary.md
            git diff -- go.mod go.sum >> update-summary.md
            echo '```' >> update-summary.md
          fi

      - name: Verify updated dependencies
        if: steps.check.outputs.updates > 0
        run: |
          echo "Verifying compatible dependency updates..."

          # Run tests to verify updates don't break anything
          if ! go test ./...; then
            echo "⚠️ Tests failed after dependency update"
            echo "Rolling back updates..."
            git checkout go.mod go.sum
            exit 1
          fi

      - name: Generate update report
        if: steps.check.outputs.updates > 0
        run: |
          echo "## Dependency Update Report" > report.md
          echo "" >> report.md
          echo "Generated: $(date -u)" >> report.md
          echo "" >> report.md

          # Show what changed
          if [ -f update-summary.md ]; then
            cat update-summary.md >> report.md
            echo "" >> report.md
          fi

          # Run security scan on new dependencies
          echo "## Security Scan" >> report.md
          echo "" >> report.md

          go install golang.org/x/vuln/cmd/govulncheck@latest
          if govulncheck ./... > vuln-check.txt 2>&1; then
            echo "✅ No vulnerabilities found in updated dependencies" >> report.md
          else
            echo "⚠️ **Vulnerabilities found:**" >> report.md
            echo '```' >> report.md
            cat vuln-check.txt >> report.md
            echo '```' >> report.md
          fi

          echo "" >> report.md
          echo "## Test Results" >> report.md
          echo "" >> report.md
          echo "✅ All tests pass with updated dependencies" >> report.md

      - name: Ensure PR labels exist
        if: steps.check.outputs.updates > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependencies --color 0366d6 --description "Dependency-related work" --force
          gh label create automated --color 5319e7 --description "Automated workflow changes" --force

      - name: Create Pull Request
        if: steps.check.outputs.updates > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Deps: Update Go dependencies"
          branch: deps/auto-update-${{ github.run_number }}
          title: "Update Go dependencies (automated)"
          body-path: report.md
          labels: dependencies,automated
          assignees: pfrederiksen

  update-github-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check action versions
        id: check-actions
        run: |
          echo "Checking GitHub Actions versions..."

          # Find all action references
          ACTIONS=$(grep -r "uses:" .github/workflows/*.yml | grep -v "#" | awk '{print $3}' | sort -u)

          echo "## GitHub Actions Version Check" > actions-report.md
          echo "" >> actions-report.md

          OUTDATED=0
          for action in $ACTIONS; do
            echo "Checking $action..."
            # This is a simplified check - in production you'd query GitHub API
            echo "- $action" >> actions-report.md
          done

          echo "outdated=$OUTDATED" >> $GITHUB_OUTPUT

      - name: Create Actions update PR
        if: steps.check-actions.outputs.outdated > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependencies --color 0366d6 --description "Dependency-related work" --force
          gh label create github-actions --color 1d76db --description "GitHub Actions maintenance" --force
          gh label create automated --color 5319e7 --description "Automated workflow changes" --force

      - name: Open Actions update PR
        if: steps.check-actions.outputs.outdated > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Deps: Update GitHub Actions versions"
          branch: deps/update-actions-${{ github.run_number }}
          title: "Update GitHub Actions (automated)"
          body-path: actions-report.md
          labels: dependencies,github-actions,automated

  check-go-version:
    name: Check Go Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest Go version
        id: go-version
        run: |
          # Get current Go version from go.mod
          CURRENT=$(grep "^go " go.mod | awk '{print $2}')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          # Get latest stable Go version
          LATEST=$(curl -s https://go.dev/VERSION?m=text | head -1 | sed 's/go//')
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          echo "Current Go version: $CURRENT"
          echo "Latest Go version: $LATEST"

      - name: Create Go version update issue
        if: steps.go-version.outputs.current != steps.go-version.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.go-version.outputs.current }}"
          LATEST="${{ steps.go-version.outputs.latest }}"

          # Check if issue already exists
          EXISTING=$(gh issue list --label "go-version" --state open --json number,title --jq '.[] | select(.title | contains("Update Go version")) | .number')

          gh label create dependencies --color 0366d6 --description "Dependency-related work" --force
          gh label create go-version --color fbca04 --description "Go version maintenance" --force

          if [ -n "$EXISTING" ]; then
            echo "Issue already exists: #$EXISTING"
          else
            gh issue create \
              --title "Update Go version from ${CURRENT} to ${LATEST}" \
              --body "A new Go version is available.

          **Current:** ${CURRENT}
          **Latest:** ${LATEST}

          Consider updating:
          - go.mod
          - .github/workflows/*.yml
          - README.md" \
              --label "dependencies" --label "go-version"
          fi

  security-advisories:
    name: Check Security Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check for CVEs
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

          echo "## Dependency Security Check" > security-report.md
          echo "" >> security-report.md
          echo "Checked: $(date -u)" >> security-report.md
          echo "" >> security-report.md

          if govulncheck ./... > vuln-output.txt 2>&1; then
            echo "✅ No known vulnerabilities in dependencies" >> security-report.md
          else
            echo "⚠️ **Vulnerabilities Found**" >> security-report.md
            echo "" >> security-report.md
            echo '```' >> security-report.md
            cat vuln-output.txt >> security-report.md
            echo '```' >> security-report.md

            # Create high-priority issue
            echo "Creating security issue..."
            cat security-report.md
          fi

      - name: Create security issue if vulnerabilities found
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create security --color b60205 --description "Security-related work" --force
          gh label create dependencies --color 0366d6 --description "Dependency-related work" --force
          gh label create high-priority --color d93f0b --description "Requires prompt attention" --force

          # Check if a similar issue already exists
          EXISTING=$(gh issue list --label "security" --label "dependencies" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing security issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file security-report.md
          else
            gh issue create \
              --title "Security: Vulnerabilities detected in dependencies" \
              --body-file security-report.md \
              --label "security" --label "dependencies" --label "high-priority"
          fi
