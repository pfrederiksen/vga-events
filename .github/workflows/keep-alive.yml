name: Workflow Keep-Alive

on:
  schedule:
    # 1st and 15th, 00:00 UTC. Calling enable on an already-active
    # workflow resets GitHub's 60-day scheduled-workflow inactivity
    # timer without dummy commits.
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select((.path | startswith(".github/workflows/")) and (.state == "active" or .state == "disabled_inactivity")) | [.path, .id] | @tsv' \
          | while IFS=$'\t' read -r path id; do
              echo "Enabling ${path} (${id})..."
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable" --silent
            done
          echo "All repository workflows re-enabled."
