name: Release Automation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.7.1)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

env:
  # Use a PAT when repository settings disallow pull request creation from
  # the default GITHUB_TOKEN. Fall back to GITHUB_TOKEN when the PAT is unset.
  AUTOMATION_PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_valid: ${{ steps.validate.outputs.is_valid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Must be in format: v1.2.3"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ Valid version format: $VERSION"
          echo "is_valid=true" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "✅ Tag-triggered release for existing tag $VERSION"
            exit 0
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "⚠️ Version $VERSION already exists"
            echo "Choose a new version when running Release Automation manually."
            exit 1
          fi

      - name: Check changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "$VERSION" CLAUDE.md; then
            echo "⚠️ Version $VERSION not found in CLAUDE.md"
            echo "Please add release notes before creating release"
            exit 1
          fi
          echo "✅ Found release notes in CLAUDE.md"

  generate-changelog:
    name: Generate Changelog
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"

          # Extract changelog from CLAUDE.md between this version and next
          CHANGELOG=$(awk "/^\\*\\*$VERSION/,/^\\*\\*v[0-9]/ {
            if (/^\\*\\*v[0-9]/ && !/^\\*\\*$VERSION/) exit;
            if (/^\\*\\*$VERSION/) next;
            print
          }" CLAUDE.md)

          if [ -z "$CHANGELOG" ]; then
            echo "⚠️ No changelog found for $VERSION in CLAUDE.md"
            CHANGELOG="No changelog provided"
          fi

          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate commit summary
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "## Commits since $PREV_TAG" >> changelog.txt
            echo "" >> changelog.txt
            git log --oneline "$PREV_TAG"..HEAD | sed 's/^/- /' >> changelog.txt
          fi

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.txt

  build-and-release:
    name: Build and Release
    needs: [validate-release, generate-changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Run tests
        run: |
          echo "Running tests before release..."
          go test -v -race ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          CHANGELOG: ${{ needs.generate-changelog.outputs.changelog }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const version = '${{ needs.validate-release.outputs.version }}';
            const changelog = process.env.CHANGELOG;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              body: changelog,
              draft: false,
              prerelease: false
            });

  update-documentation:
    name: Update Documentation
    needs: [validate-release, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update README badges
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"

          # Update version badge if it exists
          if grep -q "badge/version-" README.md; then
            sed -i "s/badge\/version-v[0-9.]*-/badge\/version-$VERSION-/" README.md
          fi

      - name: Create documentation PR
        id: create_docs_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ env.AUTOMATION_PR_TOKEN }}
          commit-message: "Docs: Update version badges to ${{ needs.validate-release.outputs.version }}"
          branch: docs/release-${{ needs.validate-release.outputs.version }}
          title: "Update documentation for ${{ needs.validate-release.outputs.version }}"
          body: |
            Auto-generated PR to update documentation after release.

            Version: ${{ needs.validate-release.outputs.version }}

            Changes:
            - Update version badges in README.md
          labels: documentation

      - name: Report documentation PR creation failure
        if: steps.create_docs_pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="docs/release-${{ needs.validate-release.outputs.version }}"
          gh issue create \
            --title "Release documentation PR requires Actions PR permission" \
            --body "The release automation workflow pushed branch \`$BRANCH\` but could not open a pull request.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Branch: ${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH

          To restore automatic PR creation, do one of the following:
          - Enable repository setting: Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests
          - Add a PAT secret named \`AUTOMATION_PR_TOKEN\` with \`repo\` scope for PR creation

          This issue was created automatically so the documentation update is still visible even when PR creation is blocked." \
            --label documentation

  notify-release:
    name: Notify Release
    needs: [validate-release, build-and-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send success notification
        if: needs.build-and-release.result == 'success'
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          echo "✅ Successfully released $VERSION"
          echo "📦 Binaries available at: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          echo "🍺 Homebrew formula updated"

      - name: Send failure notification
        if: needs.build-and-release.result == 'failure'
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          echo "❌ Release failed for $VERSION"
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
